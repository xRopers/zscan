[package]
name = "zscan-gui"
description = "Desktop front end for zscan-core"
version.workspace = true
edition.workspace = true
license.workspace = true
# egui 0.36 needs 1.95; the core library and CLI build on the workspace MSRV.
rust-version = "1.95"

[[bin]]
name = "zscan-gui"
path = "src/main.rs"

[features]
lzo = ["zscan-core/lzo", "zscan-fixtures/lzo"]
oodle = ["zscan-core/oodle"]

[dependencies]
anyhow.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
egui_extras = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico"] }
rayon.workspace = true
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
zscan-core.workspace = true

[dev-dependencies]
egui_kittest = "0.36"
tempfile.workspace = true
zscan-fixtures.workspace = true
