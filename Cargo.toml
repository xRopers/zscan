[workspace]
resolver = "3"
members = ["crates/zscan-core", "crates/zscan-cli", "crates/zscan-fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
zscan-core = { path = "crates/zscan-core" }
zscan-fixtures = { path = "crates/zscan-fixtures" }
anyhow = "1"
brotli = "9"
bzip2 = "0.6"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.4"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
lz4_flex = "0.14"
libz-sys = { version = "1.1", default-features = false, features = ["static"] }
memmap2 = "0.9"
rayon = "1"
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.14"

# The raw-deflate pass inflates at almost every offset; keep the inflater fast in debug/test builds.
[profile.dev.package.miniz_oxide]
opt-level = 3

# Parameter matching recompresses every found stream many times; bundled zlib is built by cc,
# which follows this setting.
[profile.dev.package.libz-sys]
opt-level = 3
